<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pierre Sabbagh — Senior Mobile & Web Developer specializing in Flutter, React Native, and Angular. Explore my portfolio as a tiny retro video game.">
  <meta name="google-site-verification" content="h1kMGrUujX75XqyMShtjc6fcWsyzIkQ7SX5u8m4gdS8" />
  <meta name="theme-color" content="#1D2B53">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preload" href="fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="styles.css">
  <title>Pierre Sabbagh — Portfolio Quest</title>
</head>
<body>

  <noscript>
    <div class="noscript">
      <h1>Pierre Sabbagh — Senior Mobile &amp; Web Developer</h1>
      <p>This portfolio is a small video game and needs JavaScript.</p>
      <p>
        Email: <a href="mailto:sabbaghpierre@proton.me">sabbaghpierre@proton.me</a> ·
        GitHub: <a href="https://github.com/sabbaghpierre">github.com/sabbaghpierre</a> ·
        <a href="resume.pdf" download="Pierre_Sabbagh_Resume">Résumé (PDF)</a>
      </p>
    </div>
  </noscript>

  <!-- ───── GAME SCREEN ───── -->
  <main class="stage" id="stage">
    <div class="screen-wrap" id="screenWrap">
      <canvas id="game" width="240" height="160" aria-label="Portfolio Quest game world. Use the menu for direct access to all content."></canvas>
      <div class="scanlines" aria-hidden="true"></div>

      <!-- ───── TITLE / MENU ───── -->
      <div id="menu" class="menu" role="dialog" aria-label="Main menu">
        <div class="menu-sky" aria-hidden="true"></div>
        <div class="menu-inner">
          <h1 class="menu-title">PIERRE<br>SABBAGH</h1>
          <p class="menu-sub"><span class="flame" aria-hidden="true"></span><span>PORTFOLIO QUEST</span><span class="flame flame-2" aria-hidden="true"></span></p>
          <nav class="menu-list" id="menuList" aria-label="Sections"></nav>
          <p class="menu-help">↑↓ SELECT · ENTER OK · ⌘K TERMINAL</p>
          <p class="menu-copy">© 2026 PIERRE SABBAGH · SENIOR MOBILE &amp; WEB DEV</p>
        </div>
      </div>

    </div>

    <!-- ───── DIALOG WINDOW (full-viewport so it stays readable on mobile) ───── -->
    <div id="dlg" class="dlg" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="dlg-window">
        <div class="dlg-title"><span id="dlgTitle"></span><button class="dlg-x" id="dlgClose" aria-label="Close">✕</button></div>
        <div class="dlg-body" id="dlgBody" tabindex="-1"></div>
        <div class="dlg-foot" id="dlgFoot"></div>
      </div>
    </div>

    <!-- hint bar -->
    <p class="hud" id="hud" aria-hidden="true">ARROWS / WASD MOVE · E / Z INTERACT · X / ESC MENU · M SOUND</p>

    <!-- touch controls -->
    <div class="touch" id="touch" aria-hidden="true">
      <div class="dpad">
        <button class="tbtn t-up"    data-k="up">▲</button>
        <button class="tbtn t-left"  data-k="left">◀</button>
        <button class="tbtn t-right" data-k="right">▶</button>
        <button class="tbtn t-down"  data-k="down">▼</button>
      </div>
      <div class="tact">
        <button class="tbtn tbtn-b" data-k="cancel">B</button>
        <button class="tbtn tbtn-a" data-k="action">A</button>
      </div>
    </div>
  </main>

  <!-- ───── TERMINAL ───── -->
  <div id="termOverlay" class="term-overlay" role="dialog" aria-modal="true" aria-label="Portfolio terminal" aria-hidden="true">
    <div class="term-overlay-inner">
      <div class="term-bar">
        <span class="term-titlebar">PIERRE@PORTFOLIO — ZSH</span>
        <button class="term-esc-btn" id="termClose" aria-label="Close terminal (Escape)">ESC</button>
      </div>
      <div class="term-body" id="termBody" aria-live="polite" aria-label="Terminal output"></div>
      <div class="term-input-line">
        <span class="term-prompt-label" aria-hidden="true">&gt;&nbsp;</span>
        <input
          type="text"
          id="termInput"
          class="term-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Terminal command input"
          placeholder="type help"
        >
      </div>
    </div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
