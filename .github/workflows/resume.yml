name: Build resume

on:
  push:
    branches: [master]
    paths: [resume_source.html]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF
        run: ./build.sh
      - name: Commit updated PDF
        run: |
          if git diff --quiet -- resume.pdf; then
            echo "resume.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "chore: rebuild resume PDF"
          git push
